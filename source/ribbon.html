  <style>
    #ribbon {
      --borderColor1: hsl(0, 0%, 80%);
      --nfcol: hsl(16, 99%, 43%);
      --nfcolHover: hsl(16, 99%, 53%);
      --nfcolClick: hsl(16, 99%, 33%);
      --nfcolActive: hsl(16, 99%, 43%);
      --nfcolDark: hsl(16, 99%, 33%);
      --hoverCol: hsl(0, 0%, 95%);
      --activeHovCol: hsl(16, 99%, 68%);
      --clickCol: hsl(0, 0%, 85%);
      --activeClickCol: hsl(16, 99%, 45%);
      --activeCol: hsl(16, 99%, 55%);
      --tabColor: hsl(0, 0%, 100%);
    }
    #toolbars {
      position: absolute;
      left: 0%;
      width: 100%;
      height: 10%;
      border-top: 1px var(--borderColor1) solid;
      border-bottom: 1px var(--borderColor1) solid;
    }
    .tab {
      display: inline-block;
      padding: 5px;
      color: var(--nfcol);
      background-color: var(--tabCol);
      border: 1px var(--borderColor1) solid;
      border-bottom: none;
      border-top-left-radius: 1px;
      border-top-right-radius: 1px;

      span {
        display: block;
        font-size: 14px;
      }
    }
    .inactiveTab {
      &:hover {
        background-color: var(--hoverCol);
      }
      &:active {
        background-color: var(--clickCol);
      }
    }
    /* #fileTab {
      color: var(--nfcolAlt) !important;
      background-color: var(--nfcol) !important;
    }
    #fileTab:hover {
      background-color: var(--nfcolHover) !important;
    }
    #fileTab:active {
      background-color: var(--nfcolClick) !important;
    } */
    .activeTab {
      background-color: var(--activeCol);
      color: #ffffff;
      
      &:hover {
        background-color: var(--activeHovCol);
      }
      &:active {
        background-color: var(--activeClickCol);
      }
    }
    /* .activeTab #fileTab {
      background-color: var(--nfcolActive);
    } */
    .palette {
      display: none;
      pointer-events: none;
    }
    .activePalette {
      display: block;
      pointer-events: all;
    }
  </style>
